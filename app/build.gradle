plugins { id 'com.android.application' }
android {
    namespace 'com.abhi.firelauncher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.abhi.firelauncher'
        minSdk 21
        targetSdk 25
        versionCode 3
        versionName '1.2'
    }
    buildTypes {
        release {
            // Code shrinking is off on purpose: the page talks to Java through reflection
            // (@JavascriptInterface), which R8 would rename and break.
            minifyEnabled false
            signingConfig signingConfigs.debug   // fine for sideloading
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError false; checkReleaseBuilds false }
}
